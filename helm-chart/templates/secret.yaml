apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openwebui-chatbot.fullname" . }}-env
  labels:
    {{- include "openwebui-chatbot.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Required
  OPENWEBUI_API_KEY: {{ .Values.secretEnv.OPENWEBUI_API_KEY | quote }}
  
  # Optional - OpenWebUI
  DEFAULT_OPENWEBUI_URL: {{ .Values.secretEnv.DEFAULT_OPENWEBUI_URL | quote }}
  
  # Optional - Google OAuth
  GOOGLE_CLIENT_ID: {{ .Values.secretEnv.GOOGLE_CLIENT_ID | quote }}
  GOOGLE_ALLOWED_DOMAINS: {{ .Values.secretEnv.GOOGLE_ALLOWED_DOMAINS | quote }}
  
  # Optional - Keycloak
  KEYCLOAK_ISSUER: {{ .Values.secretEnv.KEYCLOAK_ISSUER | quote }}
  KEYCLOAK_CLIENT_ID: {{ .Values.secretEnv.KEYCLOAK_CLIENT_ID | quote }}
  KEYCLOAK_CLIENT_SECRET: {{ .Values.secretEnv.KEYCLOAK_CLIENT_SECRET | quote }}
  KEYCLOAK_REDIRECT_URI: {{ .Values.secretEnv.KEYCLOAK_REDIRECT_URI | quote }}
